<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      backdrop-filter: blur(8px);
      transition: background 0.8s ease;
      overflow: hidden;
      flex-direction: column;
    }

    body.yes-bg {
      background: #000;
    }

    /* ===== Video background ===== */
    #bgVideo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      z-index: -1;
      filter: blur(7px) brightness(0.95);
      display: none;
    }

    body.video-on #bgVideo {
      display: block;
    }

    body.video-clear #bgVideo {
      filter: none;
    }

    body.video-clear .card {
      display: none !important;
    }

    /* ===== Flower link ===== */
    .flower-link {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 28px;
      text-decoration: none;
      z-index: 10;
    }

    /* ===== Cards ===== */
    .card {
      background: none;
      padding: 2rem 2.5rem;
      text-align: center;
      max-width: 600px;
      width: 90%;
      animation: pop 0.4s ease;
      max-height: 70vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      color: #000;
      font-weight: bold;
    }

    .card::-webkit-scrollbar {
      width: 8px;
    }

    .card::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0);
      border-radius: 4px;
      transition: background 0.3s;
    }

    .card:hover::-webkit-scrollbar-thumb,
    .card:active::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.3);
    }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 { margin-bottom: 0.5rem; }
    p { color: #000; }

    /* Pink text for Yes page */
    #yes h1,
    #yes p {
      color: #ff69b4;
    }

    .buttons {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button {
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: box-shadow 0.15s ease;
    }

    button:hover {
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .yes { background: #ff4d6d; color: white; }
    .no { background: #eee; position: relative; }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 2.5s ease-out forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-120vh) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Background video -->
  <!-- Background music -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <!-- Background video -->
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4" />
  </video>

  <!-- Flower easter-egg link -->
  <a class="flower-link" href="https://rajarshi-143.github.io/willubemyvalentine/" target="_blank">🌸</a>

  <!-- HOME -->
  <div class="card" id="home">
    <h1>Will you be my Valentine? 🥺</h1>
    <p>please👉👈</p>
    <div class="buttons">
      <button class="yes" data-go="yes">Yes</button>
      <button class="no" data-go="no">No</button>
    </div>
  </div>

  <!-- YES -->
  <div class="card" id="yes" style="display:none;">
    <h1>YAYYYYY 😭</h1>
    <p>i love uuuuu and press 🌸 in the corner btw for another surprise</p>
    <div class="buttons">
      <button class="yes" data-go="home">Go back</button>
      <button class="yes" id="watchVideo">Watch video 🎥</button>
    </div>
  </div>

  <!-- NO -->
  <div class="card" id="no" style="display:none;">
    <h1>egula to valo na madamji😔</h1>
    <p>go back and press yes😐</p>
    <div class="buttons">
      <button class="no" data-go="home">Go back</button>
    </div>
  </div>

  <script>
    // ===== Navigation =====
    const cards = ['home', 'yes', 'no'];

    function show(page) {
      cards.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });

      const target = document.getElementById(page);
      if (target) target.style.display = 'block';

      if (page !== 'yes') {
        document.body.classList.remove('yes-bg', 'video-on', 'video-clear');
      }
    }

    show('home');

    document.querySelectorAll('button[data-go]').forEach(btn => {
      btn.addEventListener('click', () => show(btn.dataset.go));
    });

    // ===== YES effects =====
    const yesBtn = document.querySelector('#home .yes');

    function spawnHearts(count = 18) {
      for (let i = 0; i < count; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = 2 + Math.random() * 1.5 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
      }
    }

    if (yesBtn) {
      yesBtn.addEventListener('click', () => {
        spawnHearts();
        document.body.classList.add('yes-bg', 'video-on');
      });
    }

    // ===== NO button dodge =====
    const noBtn = document.querySelector('#home .no');
    let moveCount = 0;

    if (noBtn) {
      noBtn.addEventListener('mouseenter', () => {
        if (moveCount >= 6) return;
        moveCount++;
        const x = Math.random() * 60 - 30;
        const y = Math.random() * 40 - 20;
        noBtn.style.transform = `translate(${x}px, ${y}px)`;
      });
    }

    // ===== Auto-scroll =====
    function autoScrollCard(card) {
      if (!card) return;
      const interval = setInterval(() => {
        if (card.scrollHeight <= card.clientHeight) return;
        card.scrollTop += 1;
        if (card.scrollTop + card.clientHeight >= card.scrollHeight) {
          clearInterval(interval);
        }
      }, 20);
    }

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mouseenter', () => autoScrollCard(card));
    });

    // ===== Watch video toggle =====
    const watchBtn = document.getElementById('watchVideo');
    const bgMusic = document.getElementById('bgMusic');

    if (watchBtn) {
      watchBtn.addEventListener('click', () => {
        if (bgMusic) {
          bgMusic.volume = 0.6;
          bgMusic.play().catch(() => {});
        }

        document.body.classList.add('video-clear');

        const backBtn = document.createElement('button');
        backBtn.textContent = 'Read the message 💖';
        backBtn.className = 'yes';
        backBtn.style.position = 'fixed';
        backBtn.style.bottom = '30px';
        backBtn.style.zIndex = '10';

        document.body.appendChild(backBtn);

        backBtn.addEventListener('click', () => {
          document.body.classList.remove('video-clear');
          backBtn.remove();
        });
      });
    }
  </script>
</body>
</html>
